name: Automatic News Scraper and Facebook Poster

on:
  schedule:
    # GitHub Actions uses UTC.
    # Runs every 5 minutes.
    - cron: "*/5 * * * *"

  workflow_dispatch:


jobs:

  scrape-and-post:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # DEPENDENCIES + BENGALI FONTS
      # ======================================================

      - name: Install dependencies and Bengali fonts
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            fonts-noto-core \
            fonts-noto-ui-core \
            fonts-noto-extra \
            fontconfig \
            libraqm-dev

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # VERIFY BENGALI FONTS
      # ======================================================

      - name: Verify Bengali fonts
        run: |

          echo "=========================================="
          echo "BENGALI FONT CHECK"
          echo "=========================================="

          echo ""
          echo "Installed Bengali fonts:"
          fc-list :lang=bn | head -20

          echo ""
          echo "Noto Sans Bengali Bold:"
          fc-match -f "%{file}\n" \
            "Noto Sans Bengali:style=Bold"

          echo ""
          echo "Noto Sans Bengali Regular:"
          fc-match -f "%{file}\n" \
            "Noto Sans Bengali:style=Regular"

          echo ""
          echo "=========================================="


      # ======================================================
      # SCRAPER
      # ======================================================

      - name: Run News Scraper
        env:

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

        run: |

          python scraper.py


      # ======================================================
      # FACEBOOK POSTER
      # ======================================================

      - name: Post News to Facebook
        env:

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

          META_GRAPH_VERSION: "v25.0"

        run: |

          python facebook_poster.py
